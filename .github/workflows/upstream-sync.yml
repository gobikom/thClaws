name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * 1"  # Weekly Monday 03:00 UTC (10:00 BKK)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/thClaws/thClaws.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream"
          else
            echo "$BEHIND commits behind upstream"
          fi

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit -m "sync: upstream thClaws $(git describe --tags upstream/main 2>/dev/null || git rev-parse --short upstream/main)"

      - name: Push
        if: steps.check.outputs.behind != '0'
        run: git push origin main
